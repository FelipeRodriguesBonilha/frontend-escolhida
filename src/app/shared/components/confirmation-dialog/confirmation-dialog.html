<h2 mat-dialog-title class="px-6 pt-6">{{ data.title }}</h2>
<mat-dialog-content class="px-6 py-4">
    <p>{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end" class="flex gap-3 p-6">
    <button type="button" (click)="onCancel()"
        class="px-4 py-3 border-2 border-gray-600 text-gray-600 hover:bg-gray-50 rounded-lg font-medium transition-colors flex items-center justify-center gap-2">
        <mat-icon>close</mat-icon>
        {{ data.cancelText || 'Cancelar' }}
    </button>
    <button type="button" (click)="onConfirm()"
        class="px-4 py-3 bg-gradient-to-r from-pink-600 to-pink-800 text-white rounded-lg font-medium hover:from-pink-700 hover:to-pink-900 transition-colors flex items-center justify-center gap-2">
        <mat-icon>check</mat-icon>
        {{ data.confirmText || 'Confirmar' }}
    </button>
</mat-dialog-actions>
