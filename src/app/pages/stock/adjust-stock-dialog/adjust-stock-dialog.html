<h2 mat-dialog-title class="flex items-center gap-2">
  <mat-icon>edit</mat-icon>
  Ajustar Estoque
</h2>

<mat-dialog-content>
  <div class="mb-4 p-4 bg-gray-50 rounded-lg">
    <p class="font-semibold text-gray-800">{{ data.product.name || 'Produto' }}</p>
    <p class="text-sm text-gray-600">{{ data.product.barcode || '-' }}</p>
  </div>

  <form [formGroup]="adjustForm" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-3 text-center">Quantidade em Estoque</label>
      <div class="flex items-center gap-4 w-full">
        <mat-icon (click)="decreaseQuantity()"
                  [class.opacity-30]="adjustForm.get('quantity')?.value <= 0"
                  [class.cursor-not-allowed]="adjustForm.get('quantity')?.value <= 0"
                  [class.cursor-pointer]="adjustForm.get('quantity')?.value > 0"
                  class="text-4xl text-red-600 hover:text-red-700 transition-colors select-none">
          remove
        </mat-icon>
        
        <mat-form-field class="flex-1">
          <input matInput 
                 type="number" 
                 formControlName="quantity" 
                 min="0"
                 class="text-center text-2xl font-bold">
        </mat-form-field>
        
        <mat-icon (click)="increaseQuantity()"
                  class="text-4xl text-blue-600 hover:text-blue-700 cursor-pointer transition-colors select-none">
          add
        </mat-icon>
      </div>
      <p class="text-xs text-gray-500 mt-2 text-center">
        Estoque atual: {{ data.stock.quantity }} unidades
      </p>
    </div>

    <mat-form-field class="w-full">
      <mat-label>Estoque Mínimo</mat-label>
      <input matInput type="number" formControlName="minQuantity" min="0">
      <mat-icon matPrefix>warning</mat-icon>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions class="flex gap-3 p-6">
  <button type="button" (click)="onCancel()" [disabled]="isLoading" class="px-4 py-3 border-2 border-gray-600 text-gray-600 hover:bg-gray-50 rounded-lg font-medium transition-colors flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
    <mat-icon>close</mat-icon>
    Cancelar
  </button>
  <button type="button" (click)="onSubmit()" [disabled]="adjustForm.invalid || isLoading" class="px-4 py-3 bg-gradient-to-r from-pink-600 to-pink-800 text-white rounded-lg font-medium hover:from-pink-700 hover:to-pink-900 transition-colors flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
    @if (isLoading) {
      <mat-spinner diameter="20"></mat-spinner>
      <span>Salvando...</span>
    } @else {
      <mat-icon>save</mat-icon>
      <span>Salvar</span>
    }
  </button>
</mat-dialog-actions>
